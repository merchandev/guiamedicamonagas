name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1' # lunes 05:00 America/Caracas: detecta CVE nuevas sin cambios de código

permissions:
  contents: read

jobs:
  secrets:
    name: Secretos en el repositorio (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependencies:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Bloquea vulnerabilidades críticas de producción. Las "high" restantes del
      # backend vienen del CLI de Prisma (mysql2, deepmerge-ts: sin corrección
      # compatible); se revisan en cada actualización de Prisma.
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: ${{ matrix.app }}

  codeql:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  images:
    name: Imagen ${{ matrix.image }} (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            build_args: ''
          - image: web
            context: frontend
            # El build de Next necesita URLs válidas (metadataBase); en CI da igual cuáles.
            build_args: >-
              --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
              --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen
        run: docker build ${{ matrix.build_args }} -t gmm-${{ matrix.image }}:ci ${{ matrix.context }}
      # Solo CVE críticas con corrección publicada bloquean; el resto se revisa
      # en el escaneo semanal.
      - name: Escaneo de la imagen (CRITICAL bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gmm-${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  config:
    name: Dockerfiles y compose (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Escaneo de configuración (informe)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
