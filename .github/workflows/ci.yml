name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · tipos, unitarias, build y e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: gmm
          POSTGRES_PASSWORD: gmm_ci_password
          POSTGRES_DB: gmm_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gmm -d gmm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Antivirus real para las pruebas de subida (test/unit/clamav.spec.ts): EICAR,
      # archivo limpio y subida completa por UploadSecurityService.
      clamav:
        image: clamav/clamav:1.5.4
        ports: ['3310:3310']
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 60s
    env:
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://gmm:gmm_ci_password@localhost:5432/gmm_ci?schema=public
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-thirty-two-chars
      COOKIE_SECRET: ci-cookie-secret-with-at-least-thirty-two-chars
      COOKIE_SECURE: 'false'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: gmm-ci
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-s3-secret
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: CI <ci@example.com>
      SEED_SUPERADMIN_PASSWORD: CiSuperadmin12345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Unitarias (incluye ClamAV real)
        run: npm test
        env:
          CLAMAV_TEST_HOST: 127.0.0.1
          CLAMAV_TEST_PORT: 3310
      - run: npm run build
      - name: Claves de cifrado efímeras (solo para esta ejecución)
        run: |
          echo "DATA_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_LOOKUP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # Bóveda de pacientes: código efímero que la suite e2e usa para abrirla.
          VAULT_CODE="$(openssl rand -hex 12)"
          echo "E2E_PATIENT_VAULT_CODE=${VAULT_CODE}" >> "$GITHUB_ENV"
          echo "PATIENT_VAULT_CODE_HASH=$(node -e "require('argon2').hash(process.argv[1]).then((h) => console.log(Buffer.from(h).toString('base64')))" "${VAULT_CODE}")" >> "$GITHUB_ENV"
      - name: Migraciones contra PostgreSQL limpio
        run: npx prisma migrate deploy
      - name: Esquema y migraciones sin desvío
        run: |
          DIFF="$(npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script)"
          echo "$DIFF"
          if echo "$DIFF" | grep -qE '^(ALTER|CREATE|DROP)'; then
            echo "::error::schema.prisma y las migraciones no coinciden"
            exit 1
          fi
      - run: npx ts-node prisma/seed.ts
      - name: Levantar la API
        run: |
          node dist/src/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/v1/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: Suite e2e (cifrado, consentimiento, permisos, organizaciones)
        run: npm run test:e2e
        env:
          E2E_API_URL: http://127.0.0.1:4000/api/v1
      - name: Controles administrativos y pagos concurrentes
        run: node test/e2e/admin-accounts.e2e.mjs
        env:
          E2E_API_URL: http://127.0.0.1:4000/api/v1
      - if: failure()
        run: cat api.log

  frontend:
    name: Frontend · tipos, lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # ESLint (Next.js, React Hooks, accesibilidad, TypeScript) sin advertencias.
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Sitio · extremo a extremo (Playwright)
    # La web y la API reales, compiladas como en producción, con PostgreSQL,
    # correo (Mailpit), almacenamiento S3 (S3Mock) y MFA de administradores.
    # Escritorio y teléfono, accesibilidad (axe), CSP y pruebas de seguridad.
    # Todo en 127.0.0.1: la web y la API deben compartir el host para la cookie.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: gmm
          POSTGRES_PASSWORD: gmm_ci_password
          POSTGRES_DB: gmm_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gmm -d gmm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.22
        ports: ['1025:1025', '8025:8025']
      s3:
        image: adobe/s3mock:5.2.3
        ports: ['9090:9090']
    env:
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://gmm:gmm_ci_password@127.0.0.1:5432/gmm_ci?schema=public
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-thirty-two-chars
      COOKIE_SECRET: ci-cookie-secret-with-at-least-thirty-two-chars
      COOKIE_SECURE: 'false'
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_BUCKET: gmm-ci
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-s3-secret
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAIL_FROM: Guía Médica Monagas CI <ci@example.com>
      SEED_SUPERADMIN_PASSWORD: CiSuperadmin12345
      ADMIN_MFA_ENABLED: 'true'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:4000/api/v1
      E2E_WEB_URL: http://127.0.0.1:3000
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      E2E_STORAGE: '1'
      E2E_EXPECT_ADMIN_MFA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Claves de cifrado efímeras (solo para esta ejecución)
        run: |
          echo "DATA_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_LOOKUP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: API · compilar, migrar, sembrar y levantar
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npx prisma migrate deploy
          node dist/prisma/seed.js
          node dist/src/main.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/v1/health && exit 0; sleep 2; done
          cat ../api.log; exit 1
      - name: Web · compilar como en producción (standalone) y levantar
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/version.json && exit 0; sleep 2; done
          cat ../web.log; exit 1
      - name: Pruebas de extremo a extremo
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-informe
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log
          retention-days: 7
