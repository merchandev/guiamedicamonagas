# =============================================================================
# docker-compose.prod.yml  ·  PRODUCCIÓN
# =============================================================================
# Principios de este archivo:
#
#   1. NINGÚN servicio interno (postgres, redis, minio, meilisearch) publica
#      puertos al host.  Solo Caddy expone 80/443 a Internet.
#
#   2. Todos los servicios corren en la red interna gmm_internal.
#      api y web también en gmm_dmz para poder hablar con Caddy.
#
#   3. Las credenciales de MinIO root NO se usan desde la API;
#      la API usa S3_ACCESS_KEY / S3_SECRET_KEY de un usuario de servicio
#      creado con permisos limitados (ver scripts/minio-init.sh).
#
#   4. Las imágenes están fijadas a versiones inmutables (no :latest).
#
#   5. Los contenedores de aplicación corren como usuario sin privilegios.
#
#   6. No hay fallbacks inseguros (:-default) en variables críticas;
#      si la variable no está, el contenedor no arranca.
#
# Variables requeridas en .env.prod (NO incluir en git):
#   DB_USER, DB_PASSWORD, DB_NAME
#   MEILI_MASTER_KEY
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
#   S3_ACCESS_KEY, S3_SECRET_KEY
#   JWT_SECRET, JWT_REFRESH_SECRET, COOKIE_SECRET
#   FRONTEND_URL, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM
#   + todos los opcionales del .env.example
# =============================================================================
version: '3.9'

networks:
  # Red interna: solo contenedores de la aplicación y servicios de datos.
  # Internet no puede llegar aquí directamente.
  gmm_internal:
    driver: bridge
    internal: true

  # Red DMZ: únicamente Caddy, api y web.
  # Esto permite que Caddy haga reverse proxy sin que los servicios de datos
  # queden accesibles desde la DMZ.
  gmm_dmz:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Servicios de datos — SOLO red interna, sin puertos al host
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16.4-alpine
    container_name: gmm_postgres
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gmm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: gmm_redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - gmm_internal
    security_opt:
      - no-new-privileges:true

  meilisearch:
    image: getmeili/meilisearch:v1.10.3
    container_name: gmm_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    networks:
      - gmm_internal
    security_opt:
      - no-new-privileges:true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-29-46Z
    container_name: gmm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Deshabilitar acceso anónimo globalmente
      MINIO_BROWSER: "on"
    volumes:
      - miniodata:/data
    networks:
      - gmm_internal
    security_opt:
      - no-new-privileges:true
    # La consola (9001) NO se expone. Acceso solo via VPN/SSH tunnel.

  # ---------------------------------------------------------------------------
  # Aplicación — red interna + DMZ
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gmm_api:latest
    container_name: gmm_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # La API usa el usuario de servicio limitado, NO las credenciales root
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER:-}
      PAGO_MOVIL_BANK_NAME: ${PAGO_MOVIL_BANK_NAME}
      PAGO_MOVIL_BANK_CODE: ${PAGO_MOVIL_BANK_CODE}
      PAGO_MOVIL_PHONE: ${PAGO_MOVIL_PHONE}
      PAGO_MOVIL_ID: ${PAGO_MOVIL_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - gmm_internal
      - gmm_dmz
    # Sin puertos al host: solo accesible desde Caddy via gmm_dmz
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: gmm_web:latest
    container_name: gmm_web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - gmm_dmz
    # Sin puertos al host: solo accesible desde Caddy via gmm_dmz
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Proxy inverso — única entrada desde Internet
  # ---------------------------------------------------------------------------

  caddy:
    image: caddy:2.9-alpine
    container_name: gmm_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gmm_dmz
    depends_on:
      - api
      - web
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  caddy_data:
  caddy_config:
