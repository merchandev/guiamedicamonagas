# =============================================================================
# docker-compose.prod.yml  ·  PRODUCCIÓN
# =============================================================================
# Principios de este archivo:
#
#   1. NINGÚN servicio interno (postgres, redis, minio, meilisearch) publica
#      puertos al host.  Solo Caddy expone un puerto a Internet (CADDY_PORT,
#      por defecto 8088 — ver Caddyfile).
#
#   2. Todos los servicios corren en la red interna gmm_internal.
#      api y web también en gmm_dmz para poder hablar con Caddy.
#
#   3. Las credenciales de MinIO root NO se usan desde la API;
#      la API usa S3_ACCESS_KEY / S3_SECRET_KEY de un usuario de servicio
#      creado con permisos limitados (ver scripts/minio-init.sh).
#
#   4. Las imágenes están fijadas a versiones inmutables (no :latest).
#
#   5. Los contenedores de aplicación corren como usuario sin privilegios.
#
#   6. No hay fallbacks inseguros (:-default) en variables críticas;
#      si la variable no está, el contenedor no arranca.
#
# Variables requeridas en .env.prod (NO incluir en git):
#   DB_USER, DB_PASSWORD, DB_NAME
#   MEILI_MASTER_KEY
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
#   S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET
#   JWT_SECRET, JWT_REFRESH_SECRET, COOKIE_SECRET
#   DATA_ENCRYPTION_KEYS, DATA_LOOKUP_KEY  (respaldar aparte: sin ellas los
#   datos cifrados de pacientes son irrecuperables)
#   FRONTEND_URL, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, S3_PUBLIC_ENDPOINT
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM
#   CADDY_PORT (puerto público de Caddy; ver Caddyfile)
#   + todos los opcionales del .env.example
#
# Este stack corre como proyecto Compose aislado ("gmm-independent", ver
# `name:` abajo) para convivir en el mismo VPS con otros proyectos Docker sin
# interferir: nombres de red, volúmenes y contenedores exclusivos, y ningún
# puerto publicado choca con lo que ya esté ocupado (ver Caddyfile: por
# defecto HTTP simple en :8088, no 80/443).
# =============================================================================

name: gmm-independent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Red interna: solo contenedores de la aplicación y servicios de datos.
  # Internet no puede llegar aquí directamente.
  gmm_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.77.0/24

  # Red DMZ: únicamente Caddy, api y web.
  # Esto permite que Caddy haga reverse proxy sin que los servicios de datos
  # queden accesibles desde la DMZ.
  gmm_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.78.0/24

  gmm_storage:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.79.0/24

  # Salida a Internet solo para que el antivirus descargue firmas (freshclam).
  # Ningún otro servicio está en esta red.
  gmm_av_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.80.0/24

services:
  # ---------------------------------------------------------------------------
  # Servicios de datos — SOLO red interna, sin puertos al host
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16.4-alpine
    logging: *default-logging
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gmm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # Límites conservadores para no afectar a otros proyectos del mismo VPS.
    # Ajustar según los recursos realmente libres del servidor.
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7.4-alpine
    logging: *default-logging
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - gmm_internal
    security_opt:
      - no-new-privileges:true
    mem_limit: 320m
    cpus: 0.3

  meilisearch:
    image: getmeili/meilisearch:v1.10.3
    logging: *default-logging
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    networks:
      - gmm_internal
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging: *default-logging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Deshabilitar acceso anónimo globalmente
      MINIO_BROWSER: "on"
    volumes:
      - miniodata:/data
    networks:
      - gmm_internal
      - gmm_storage
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    # La consola (9001) NO se expone. Acceso solo via VPN/SSH tunnel.

  # ---------------------------------------------------------------------------
  # Aplicación — red interna + DMZ
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gmm-independent-api:${GMM_IMAGE_TAG:-local}
    logging: *default-logging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # La API usa el usuario de servicio limitado, NO las credenciales root
      S3_ENDPOINT: http://minio:9000
      # URL pública (proxeada por Caddy) usada solo para firmar URLs de
      # descarga que abre el navegador — ver storage.service.ts y Caddyfile.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # false mientras se sirva por HTTP simple (ver Caddyfile); pasar a
      # true en cuanto el sitio tenga HTTPS real.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER:-}
      PAGO_MOVIL_BANK_NAME: ${PAGO_MOVIL_BANK_NAME}
      PAGO_MOVIL_BANK_CODE: ${PAGO_MOVIL_BANK_CODE}
      PAGO_MOVIL_PHONE: ${PAGO_MOVIL_PHONE}
      PAGO_MOVIL_ID: ${PAGO_MOVIL_ID}
      # SEC-05: llavero de cifrado de datos de pacientes (fuera de PostgreSQL).
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS}
      DATA_ENCRYPTION_ACTIVE_KEY: ${DATA_ENCRYPTION_ACTIVE_KEY:-v1}
      DATA_LOOKUP_KEY: ${DATA_LOOKUP_KEY}
      ADMIN_MFA_ENABLED: ${ADMIN_MFA_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - gmm_internal
      - gmm_dmz
    # Sin puertos al host: solo accesible desde Caddy via gmm_dmz
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_BUILD_CPUS: 1
    image: gmm-independent-web:${GMM_IMAGE_TAG:-local}
    logging: *default-logging
    restart: unless-stopped
    environment:
      # Runtime (NO build arg): el servidor Next.js dentro del contenedor lee
      # esto para sus fetches SSR, apuntando al nombre interno del servicio
      # en vez de la URL pública — ver server-fetch.ts.
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gmm_dmz
    # Sin puertos al host: solo accesible desde Caddy via gmm_dmz
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/iniciar-sesion').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    logging: *default-logging
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - maildata:/data
    ports:
      - "127.0.0.1:18025:8025"
    networks:
      - gmm_internal
      # Una red no-interna del proyecto es necesaria para que el mapeo de
      # puerto en loopback funcione (una red 100% `internal: true` no monta
      # las reglas de NAT que el port-publishing de Docker necesita).
      - gmm_dmz
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.2

  # ---------------------------------------------------------------------------
  # Antivirus de subidas — opcional (perfil "antivirus")
  # ---------------------------------------------------------------------------
  # Se activa con COMPOSE_PROFILES=antivirus y CLAMAV_HOST=clamav en .env.prod.
  # La API le envía cada archivo por TCP 3310 (INSTREAM) y falla cerrado: si
  # clamd no responde, la subida se rechaza. ~1,3 GB de RAM con las firmas
  # cargadas; ver scripts/clamd.conf (sin recarga concurrente).
  clamav:
    image: clamav/clamav:1.5.4
    profiles: [antivirus]
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
      - ./scripts/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - gmm_internal
      - gmm_av_egress
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0

  # ---------------------------------------------------------------------------
  # Proxy inverso — única entrada desde Internet
  # ---------------------------------------------------------------------------

  caddy:
    image: caddy:2.9-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      # El Caddyfile usa {$S3_BUCKET} para el path del proxy de archivos.
      S3_BUCKET: ${S3_BUCKET}
    ports:
      # Puerto alterno: 80/443 son del Traefik compartido del VPS. Acceso
      # directo por IP en HTTP simple — ver Caddyfile.
      - "${CADDY_PORT:-8088}:8088"
    # Dominio propio con HTTPS a través del Traefik del servidor (proyecto
    # traefik-ivzc, dueño de 80/443 y de los certificados Let's Encrypt): lo
    # descubre por estas etiquetas, igual que a los demás proyectos, sin
    # cambiar su configuración. Se activa con GMM_DOMAIN y
    # GMM_TRAEFIK_ENABLE=true en .env.prod; www redirige al dominio principal.
    labels:
      traefik.enable: "${GMM_TRAEFIK_ENABLE:-false}"
      traefik.docker.network: gmm-independent_gmm_dmz
      traefik.http.routers.gmm.rule: "Host(`${GMM_DOMAIN:-gmm.invalid}`) || Host(`www.${GMM_DOMAIN:-gmm.invalid}`)"
      traefik.http.routers.gmm.entrypoints: websecure
      traefik.http.routers.gmm.tls: "true"
      traefik.http.routers.gmm.tls.certresolver: letsencrypt
      traefik.http.routers.gmm.middlewares: gmm-www-to-apex
      traefik.http.middlewares.gmm-www-to-apex.redirectregex.regex: "^https://www\\.(.+)"
      traefik.http.middlewares.gmm-www-to-apex.redirectregex.replacement: "https://$${1}"
      traefik.http.middlewares.gmm-www-to-apex.redirectregex.permanent: "true"
      traefik.http.services.gmm.loadbalancer.server.port: "8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gmm_dmz
      - gmm_storage
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.3

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  caddy_data:
  caddy_config:
  maildata:
  clamavdata:
