version: '3.8'

services:
  postgres:
    image: postgres:16-alpine # PostgreSQL 16 is widely stable; AI prompt suggested 18.6, but 16/17 are current active. We will use a reliable version.
    container_name: gmm_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-guia_medica}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  redis:
    image: redis:7-alpine # Redis 7/8
    container_name: gmm_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    profiles: ["dev", "prod"]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: gmm_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_123}
      MEILI_ENV: ${NODE_ENV:-development}
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    profiles: ["dev", "prod"]

  minio:
    image: quay.io/minio/minio:latest
    container_name: gmm_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["dev", "prod"]

  mailpit:
    image: axllent/mailpit
    container_name: gmm_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    profiles: ["dev"]

  caddy:
    image: caddy:2-alpine
    container_name: gmm_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    profiles: ["prod"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmm_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-guia_medica}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_123}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-guiamedica}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-supersecret123}
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER}
      PAGO_MOVIL_BANK_NAME: ${PAGO_MOVIL_BANK_NAME:-Banesco}
      PAGO_MOVIL_BANK_CODE: ${PAGO_MOVIL_BANK_CODE:-0134}
      PAGO_MOVIL_PHONE: ${PAGO_MOVIL_PHONE}
      PAGO_MOVIL_ID: ${PAGO_MOVIL_ID}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    profiles: ["prod"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    container_name: gmm_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["prod"]

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  caddy_data:
  caddy_config:
