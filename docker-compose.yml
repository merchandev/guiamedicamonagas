version: '3.8'

services:
  postgres:
    image: postgres:16-alpine # PostgreSQL 16 is widely stable; AI prompt suggested 18.6, but 16/17 are current active. We will use a reliable version.
    container_name: gmm_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-guia_medica}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  redis:
    image: redis:7-alpine # Redis 7/8
    container_name: gmm_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    profiles: ["dev", "prod"]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: gmm_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_123}
      MEILI_ENV: ${NODE_ENV:-development}
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    profiles: ["dev", "prod"]

  minio:
    image: minio/minio:latest
    container_name: gmm_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["dev", "prod"]

  mailpit:
    image: axllent/mailpit
    container_name: gmm_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    profiles: ["dev"]

  caddy:
    image: caddy:2-alpine
    container_name: gmm_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    profiles: ["prod"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmm_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-guia_medica}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_123}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["prod"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gmm_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["prod"]

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  caddy_data:
  caddy_config:
