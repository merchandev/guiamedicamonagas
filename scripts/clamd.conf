# clamd de Guía Médica Monagas (servicio `clamav`, perfil "antivirus" de
# docker-compose.prod.yml). Parte de la configuración por defecto de la imagen
# clamav/clamav:1.5.4 y solo cambia lo marcado.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# VPS compartido: al actualizar las firmas, clamd no carga una segunda copia
# de la base en memoria (que duplicaría el consumo, ~1,3 GB → ~2,6 GB). A
# cambio no atiende durante los segundos de la recarga; la API falla cerrado y
# esa subida se reintenta.
ConcurrentDatabaseReload no

# Las subidas de la API pesan como máximo 10 MB; margen para el envío INSTREAM.
StreamMaxLength 25M
